[package]
name = "file-peek"
version = "2.0.0"
edition = "2024"
rust-version = "1.87"
description = "A native macOS file viewer with Rust Markdown previews and Quick Look."
license = "MIT"
repository = "https://github.com/Samuel-Morgan-Tyghe/file-peek"

[[bin]]
name = "FilePeek"
path = "src/main.rs"

[dependencies]
block2 = "0.6"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSApplication", "NSRunningApplication", "NSWindow", "NSResponder", "NSView", "NSControl", "NSButton", "NSButtonCell", "NSSegmentedControl", "NSMenu", "NSMenuItem", "NSToolbar", "NSToolbarItem", "NSImage", "NSImageView", "NSColor", "NSFont", "NSFontDescriptor", "NSText", "NSTextView", "NSTextContainer", "NSTextField", "NSScrollView", "NSClipView", "NSStackView", "NSUserInterfaceLayout", "NSLayoutConstraint", "NSLayoutAnchor", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSAlert", "NSWorkspace", "NSDocumentController", "NSDragging", "NSPasteboard", "NSCell", "NSGraphics", "NSAccessibility", "NSAccessibilityProtocols", "NSEvent"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKNavigation", "WKNavigationDelegate", "WKNavigationAction", "WKFrameInfo", "WKContentWorld", "WKURLSchemeHandler", "WKURLSchemeTask"] }
objc2-quick-look-ui = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "QLPreviewView", "QLPreviewItem"] }
objc2-uniform-type-identifiers = "0.3.2"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
url = "2"
percent-encoding = "2"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
